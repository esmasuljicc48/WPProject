<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Looply is a peaceful stitch diary for knitters, crocheters, and makers.">
  <title>Looply — A stitch diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/spapp.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <nav class="navbar navbar-expand-lg app-nav" aria-label="Main navigation">
      <div class="container-xxl px-3 px-lg-4">
        <a class="brand-lockup" href="#view_home" aria-label="Looply home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M12.5 24.5c0-7.2 5.2-12.4 11.7-12.4 5 0 9.2 2.5 11 6.9" />
              <path d="M35.5 23.5c0 7.2-5.2 12.4-11.7 12.4-5 0-9.2-2.5-11-6.9" />
              <circle cx="24" cy="24" r="4.2" />
            </svg>
          </span>
          <span>
            <span class="brand-name">Looply</span>
            <span class="brand-subtitle">A stitch diary</span>
          </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="nav-search-wrap mx-lg-auto my-3 my-lg-0">
            <label class="visually-hidden" for="projectSearch">Search projects</label>
            <div class="nav-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
              <input id="projectSearch" type="search" placeholder="Search projects or makers" autocomplete="off">
            </div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <a class="saved-link d-none d-lg-inline" href="#view_favorites">Saved</a>
            <a class="btn btn-new-project" href="#view_new_project"><span aria-hidden="true">+</span> New project</a>
            <a class="profile-button" href="#view_profile" aria-label="Open your profile"><span class="avatar avatar-small">ES</span></a>
          </div>
        </div>
      </div>
    </nav>

    <main id="spapp" role="main"></main>

    <footer class="journal-footer">
      <div class="container-xxl px-3 px-lg-4">
        <p class="footer-signoff">Made stitch by stitch with love, warm tea, and loose yarn ends.</p>
        <div class="footer-bottom">
          <span>Looply — A stitch diary</span>
          <span>© 2026 — Built for crafters</span>
          <a href="#view_home" data-back-to-top>Back to top <span aria-hidden="true">↑</span></a>
        </div>
      </div>
    </footer>
  </div>

  <template id="projectCardTemplate">
    <article class="project-card">
      <div class="project-image-wrap">
        <img class="project-image" loading="lazy" alt="">
        <button class="favorite-button" type="button" aria-label="Save project" data-favorite>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.9c0 5.1-8.8 10.2-8.8 10.2S3.2 14 3.2 8.9A4.7 4.7 0 0 1 8 4.2c1.4 0 2.7.6 4 2 1.3-1.4 2.6-2 4-2a4.7 4.7 0 0 1 4.8 4.7Z"></path></svg>
        </button>
      </div>
      <div class="project-card-body">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <span class="craft-badge"></span>
          <span class="rating-badge"><span aria-hidden="true">★</span> <span class="rating"></span></span>
        </div>
        <h3 class="project-title"></h3>
        <div class="project-footer">
          <div class="maker"><span class="avatar avatar-tiny maker-avatar"></span><span class="maker-name"></span></div>
          <span class="project-date"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="js/jquery.spapp.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
