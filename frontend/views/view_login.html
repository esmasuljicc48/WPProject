<section class="auth-view">
  <div class="auth-card">
    <a class="brand-lockup auth-brand" href="#view_login" aria-label="Looply login">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" role="img"><path d="M12.5 24.5c0-7.2 5.2-12.4 11.7-12.4 5 0 9.2 2.5 11 6.9" /><path d="M35.5 23.5c0 7.2-5.2 12.4-11.7 12.4-5 0-9.2-2.5-11-6.9" /><circle cx="24" cy="24" r="4.2" /></svg></span>
      <span><span class="brand-name">Looply</span><span class="brand-subtitle">A stitch diary</span></span>
    </a>
    <p class="eyebrow"><span class="eyebrow-dot"></span> Welcome back</p>
    <h1>Make space for<br><em>your next stitch.</em></h1>
    <p class="auth-copy">A quiet place to keep track of the things you make, one project at a time.</p>
    <form id="loginForm" class="auth-form">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" name="email" type="email" placeholder="you@example.com">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" name="password" type="password" placeholder="Your password">
      <button class="btn btn-new-project auth-submit" type="submit">Log in <span aria-hidden="true">↗</span></button>
    </form>
    <p class="auth-switch">New to Looply? <a href="#view_register">Create an account</a></p>
    <p class="auth-switch"><a href="#view_home">Browse as a guest</a></p>
  </div>
</section>
