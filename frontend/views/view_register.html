<section class="auth-view">
  <div class="auth-card">
    <a class="brand-lockup auth-brand" href="#view_login" aria-label="Looply login">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" role="img"><path d="M12.5 24.5c0-7.2 5.2-12.4 11.7-12.4 5 0 9.2 2.5 11 6.9" /><path d="M35.5 23.5c0 7.2-5.2 12.4-11.7 12.4-5 0-9.2 2.5-11-6.9" /><circle cx="24" cy="24" r="4.2" /></svg></span>
      <span><span class="brand-name">Looply</span><span class="brand-subtitle">A stitch diary</span></span>
    </a>
    <p class="eyebrow"><span class="eyebrow-dot"></span> Start a quiet practice</p>
    <h1>Find your way<br><em>back to making.</em></h1>
    <p class="auth-copy">Create a space for your projects, notes, and all the small things worth remembering.</p>
    <form id="registerForm" class="auth-form">
      <label for="registerName">Full name</label><input id="registerName" name="name" type="text" placeholder="Your name" required>
      <label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" placeholder="you@example.com" required>
      <label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" placeholder="Create a password" required>
      <button class="btn btn-new-project auth-submit" type="submit">Create account <span aria-hidden="true">↗</span></button>
    </form>
    <p class="auth-switch">Already have an account? <a href="#view_login">Log in</a></p>
    <p class="auth-switch"><a href="#view_home">Browse as a guest</a></p>
  </div>
</section>
