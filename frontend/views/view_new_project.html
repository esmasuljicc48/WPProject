<section class="container-xxl px-3 px-lg-4 pb-5 app-view">
  <div class="page-heading"><p class="eyebrow"><span class="eyebrow-dot"></span> A new diary entry</p><h1>What are you<br><em>making today?</em></h1><p class="welcome-copy">Add a little note, a picture, or just the feeling of the thing. There is no perfect way to fill this in.</p></div>
  <form id="newProjectForm" class="journal-form">
    <div class="journal-paper"><label for="projectTitle">Project name</label><input id="projectTitle" name="title" required type="text" placeholder="a soft blue scarf"><label for="projectCategory">It is...</label><input id="projectCategory" name="category" required type="text" placeholder="knitting, crochet, sewing..."><div class="journal-row"><div><label for="projectYarn">Yarn</label><textarea id="projectYarn" name="yarn" rows="2" placeholder="the softest wool"></textarea></div><div><label for="projectSize">Needles/hook</label><textarea id="projectSize" name="size" rows="2" placeholder="4 mm needles"></textarea></div></div><label for="projectPattern">Pattern or source <span>(link or your own note)</span></label><textarea id="projectPattern" name="pattern" rows="3" placeholder="https:// or freestyle"></textarea><div class="journal-footer-row"><label for="projectRating">Rating</label><select id="projectRating" name="rating"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div><fieldset class="privacy-fieldset"><legend>Who can see this project?</legend><div class="privacy-options"><label><input type="radio" name="privacy" value="public" checked> Public</label><label><input type="radio" name="privacy" value="private"> Private</label></div></fieldset></div>
    <label class="photo-picker" for="projectImage"><span class="photo-preview" id="photoPreview"><span>＋</span><img alt="" aria-hidden="true"></span><span class="photo-picker-copy"><strong>Add a picture</strong><small>Take one now or choose one from your gallery</small></span><input id="projectImage" name="image" required type="file" accept="image/*"></label>
    <div class="diary-notes-card"><label for="projectDescription">Diary notes</label><textarea id="projectDescription" name="description" rows="7" placeholder="Write about the process, the good parts, the tricky parts, or whatever you want to remember..."></textarea></div>
    <button class="btn btn-new-project form-submit" type="submit">Add to my diary <span>↗</span></button>
  </form>
</section>
